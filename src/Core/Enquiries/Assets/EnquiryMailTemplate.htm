<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{Title}</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f4f4f4; margin: 0; padding: 0;">
    <div style="width: 100%; max-width: 600px; margin: 0 auto; background-color: #ffffff; padding: 20px; box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);">
        <div style="background-color: #4CAF50; color: white; padding: 10px 0; text-align: center;">
            <h1 style="margin: 0;">{Title}</h1>
        </div>
        <div style="margin: 20px 0;">
            <p style="margin: 10px 0;"><strong>Name:</strong> {Name}</p>
            <p style="margin: 10px 0;"><strong>Email:</strong> {Email}</p>
            <p style="margin: 10px 0;"><strong>Subject:</strong> {Subject}</p>
            <p style="margin: 10px 0;"><strong>Message:</strong></p>
            <p style="margin: 10px 0;">{Message}</p>
        </div>
        <div style="text-align: center; padding: 10px 0; font-size: 12px; color: #777777;">
            <p style="margin: 0;">&copy; 2024 DevList. All rights reserved.</p>
        </div>
    </div>
</body>
</html>
